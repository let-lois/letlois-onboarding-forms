name = "letlois-onboarding"
compatibility_date = "2026-08-27"
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "letlois-onboarding"
database_id = "d35e051e-2f19-4c83-ac58-3cc15f9c3092"

[vars]
SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzqJ04XGP-0U_LN_e4fBDK5KIP9EgK7R7tg9XjcS3_asW8qB1cucaohehqAtnk96AFP/exec"
GOOGLE_DRIVE_PARENT_FOLDER_ID = "0ADsUTq_SmUjEUk9PVA"

# GOOGLE_SERVICE_ACCOUNT_KEY_JSON is set as an encrypted secret instead of a
# plaintext var here — see the Cloudflare dashboard, Worker → Settings →
# Variables and Secrets. Never put a private key in this file; this file is
# committed to GitHub and vars here are stored in plain text.
