<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads Onboarding — Part 2: Website</title>

<!--
  Ads plan, Part 2 of 3 — Website details.
  This page only defines CONFIG. All rendering/logic lives in
  /shared/onboarding-engine-v2.js. Edit the "steps" array below to change
  questions. Step ids must match what src/api/submit-website.js reads.

  The preview drawings (phone designs, pricing layouts, map layouts) are
  made by the small helper functions at the top of the script. Each template
  card can also take a demoUrl to show a "View demo" link under it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/onboarding.css">
<link rel="stylesheet" href="../../shared/onboarding-extras.css">
</head>
<body>

<div class="shell">
  <img class="brand-mark" src="../../shared/assets/logo-icon.png" alt="LetLois">
  <div class="card" id="card"></div>
  <footer class="credit" id="footerCredit"></footer>
</div>
<span class="visually-hidden" aria-live="polite" id="liveRegion"></span>

<script src="../../shared/onboarding-engine-v2.js"></script>
<script>
  /* ---------- tiny drawing helpers for the preview cards ---------- */
  var C = { frame: "#3B3F47", screen: "#101216", bar: "#1E2127", field: "#2B2F37", line: "#4A505A", lineLt: "#8A909A",
            white: "#E8EAED", acc: "#47B7E8", accDk: "#0F75BC", photo: "#3A4250", photoDk: "#2A303A", navy: "#26303F", map: "#2A3441", ink: "#0B1220" };
  function R(x, y, w, h, rx, fill, stroke) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + rx + '" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '"' : "") + "/>";
  }
  function Ci(cx, cy, r, fill, stroke) {
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="1.5"' : "") + "/>";
  }
  function Ln(x1, y1, x2, y2, stroke, w) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + stroke + '" stroke-width="' + (w || 1.6) + '" stroke-linecap="round"/>';
  }
  function Poly(points, fill) { return '<polygon points="' + points + '" fill="' + fill + '"/>'; }
  function Svg(w, h, label, body) {
    return '<svg viewBox="0 0 ' + w + " " + h + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + label + '">' + body + "</svg>";
  }
  function stars(x, y, n) {
    var s = "";
    for (var i = 0; i < n; i++) s += Ci(x + i * 8, y, 2.5, C.acc);
    return s;
  }
  function phoneShell() { return R(0.5, 0.5, 119, 225, 16, C.screen, C.frame) + R(46, 4, 28, 5, 2.5, C.frame); }
  function blank(w, h, label) {
    return Svg(w, h, label,
      '<rect x="1" y="1" width="' + (w - 2) + '" height="' + (h - 2) + '" rx="12" fill="none" stroke="' + C.lineLt + '" stroke-width="1.5" stroke-dasharray="5 4"/>' +
      Ln(w / 2 - 8, h / 2, w / 2 + 8, h / 2, C.lineLt, 2) + Ln(w / 2, h / 2 - 8, w / 2, h / 2 + 8, C.lineLt, 2));
  }

  /* ---------- three phone designs ---------- */
  // Bold and direct: logo left, menu right, dark hero, big call button, sticky call bar
  function phoneBold() {
    return Svg(120, 226, "Phone design with a left logo, a dark headline hero, and a call bar",
      phoneShell() +
      R(8, 13, 104, 22, 4, C.bar) + Ci(20, 24, 6, C.acc) + R(30, 22, 24, 4, 2, C.lineLt) +
      Ln(97, 19, 107, 19, C.lineLt) + Ln(97, 24, 107, 24, C.lineLt) + Ln(97, 29, 107, 29, C.lineLt) +
      R(8, 39, 104, 92, 4, C.navy) +
      R(16, 51, 78, 8, 2, C.white) + R(16, 63, 58, 8, 2, C.acc) + R(16, 75, 70, 8, 2, C.white) +
      R(16, 91, 82, 3, 1.5, C.lineLt) + R(16, 98, 64, 3, 1.5, C.lineLt) +
      R(16, 109, 88, 12, 3, C.acc) + R(42, 113, 36, 4, 2, C.ink) +
      stars(18, 143, 5) + R(62, 141, 42, 4, 2, C.lineLt) +
      R(8, 153, 50, 28, 4, C.bar) + Ci(18, 164, 4.5, C.accDk) + R(27, 161, 24, 3, 1.5, C.lineLt) + R(27, 167, 18, 3, 1.5, C.line) +
      R(62, 153, 50, 28, 4, C.bar) + Ci(72, 164, 4.5, C.accDk) + R(81, 161, 24, 3, 1.5, C.lineLt) + R(81, 167, 18, 3, 1.5, C.line) +
      R(8, 196, 104, 20, 6, C.acc) + R(36, 204, 48, 4, 2, C.ink));
  }
  // Clean and trusted: menu left, centered logo, phone icon right, photo on top, free-estimate form
  function phoneClean() {
    return Svg(120, 226, "Phone design with a centered logo, a photo, and a free estimate form",
      phoneShell() +
      R(8, 13, 104, 22, 4, C.bar) +
      Ln(14, 20, 24, 20, C.lineLt) + Ln(14, 24, 24, 24, C.lineLt) + Ln(14, 28, 24, 28, C.lineLt) +
      Ci(52, 24, 5, C.acc) + R(60, 22, 24, 4, 2, C.lineLt) + Ci(101, 24, 5.5, "none", C.acc) +
      R(8, 39, 104, 52, 4, C.photo) + Poly("28,78 60,54 92,78", "#4D5666") + R(44, 78, 32, 13, 0, "#4D5666") +
      R(24, 99, 72, 7, 2, C.white) + R(36, 110, 48, 7, 2, C.white) +
      R(30, 123, 60, 3, 1.5, C.lineLt) +
      R(32, 132, 56, 12, 6, C.acc) + R(46, 136, 28, 4, 2, C.ink) +
      R(8, 152, 104, 46, 5, C.bar) + R(16, 158, 88, 9, 3, C.field) + R(16, 170, 88, 9, 3, C.field) + R(16, 183, 88, 9, 3, C.accDk) +
      stars(44, 211, 5));
