<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads Onboarding — Part 2: Website</title>

<!--
  Ads plan, Part 2 of 3 — Website details.
  This page only defines CONFIG. All rendering/logic lives in
  /shared/onboarding-engine-v2.js. Edit the "steps" array below to change
  questions. Step ids must match what src/api/submit-website.js reads.

  The preview drawings (phone designs, pricing layouts, map layouts) are
  made by the small helper functions at the top of the script. Each template
  card can also take a demoUrl to show a "View demo" link under it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/onboarding.css">
<link rel="stylesheet" href="../../shared/onboarding-extras.css">
</head>
<body>

<div class="shell">
  <img class="brand-mark" src="../../shared/assets/logo-icon.png" alt="LetLois">
  <div class="card" id="card"></div>
  <footer class="credit" id="footerCredit"></footer>
</div>
<span class="visually-hidden" aria-live="polite" id="liveRegion"></span>

<script src="../../shared/onboarding-engine-v2.js"></script>
<script>
  /* ---------- tiny drawing helpers for the preview cards ---------- */
  var C = { frame: "#3B3F47", screen: "#101216", bar: "#1E2127", field: "#2B2F37", line: "#4A505A", lineLt: "#8A909A",
            white: "#E8EAED", acc: "#47B7E8", accDk: "#0F75BC", photo: "#3A4250", photoDk: "#2A303A", navy: "#26303F", map: "#2A3441", ink: "#0B1220" };
  function R(x, y, w, h, rx, fill, stroke) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + rx + '" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '"' : "") + "/>";
  }
  function Ci(cx, cy, r, fill, stroke) {
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="1.5"' : "") + "/>";
  }
  function Ln(x1, y1, x2, y2, stroke, w) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + stroke + '" stroke-width="' + (w || 1.6) + '" stroke-linecap="round"/>';
  }
  function Poly(points, fill) { return '<polygon points="' + points + '" fill="' + fill + '"/>'; }
  function Svg(w, h, label, body) {
    return '<svg viewBox="0 0 ' + w + " " + h + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + label + '">' + body + "</svg>";
  }
  function stars(x, y, n) {
    var s = "";
    for (var i = 0; i < n; i++) s += Ci(x + i * 8, y, 2.5, C.acc);
    return s;
  }
  function phoneShell() { return R(0.5, 0.5, 119, 225, 16, C.screen, C.frame) + R(46, 4, 28, 5, 2.5, C.frame); }
  /* ---------- three phone designs ---------- */
  // Bold and direct: logo left, menu right, dark hero, big call button, sticky call bar
  function phoneBold() {
    return Svg(120, 226, "Phone design with a left logo, a dark headline hero, and a call bar",
      phoneShell() +
      R(8, 13, 104, 22, 4, C.bar) + Ci(20, 24, 6, C.acc) + R(30, 22, 24, 4, 2, C.lineLt) +
      Ln(97, 19, 107, 19, C.lineLt) + Ln(97, 24, 107, 24, C.lineLt) + Ln(97, 29, 107, 29, C.lineLt) +
      R(8, 39, 104, 92, 4, C.navy) +
      R(16, 51, 78, 8, 2, C.white) + R(16, 63, 58, 8, 2, C.acc) + R(16, 75, 70, 8, 2, C.white) +
      R(16, 91, 82, 3, 1.5, C.lineLt) + R(16, 98, 64, 3, 1.5, C.lineLt) +
      R(16, 109, 88, 12, 3, C.acc) + R(42, 113, 36, 4, 2, C.ink) +
      stars(18, 143, 5) + R(62, 141, 42, 4, 2, C.lineLt) +
      R(8, 153, 50, 28, 4, C.bar) + Ci(18, 164, 4.5, C.accDk) + R(27, 161, 24, 3, 1.5, C.lineLt) + R(27, 167, 18, 3, 1.5, C.line) +
      R(62, 153, 50, 28, 4, C.bar) + Ci(72, 164, 4.5, C.accDk) + R(81, 161, 24, 3, 1.5, C.lineLt) + R(81, 167, 18, 3, 1.5, C.line) +
      R(8, 196, 104, 20, 6, C.acc) + R(36, 204, 48, 4, 2, C.ink));
  }
  // Clean and trusted: menu left, centered logo, phone icon right, photo on top, free-estimate form
  function phoneClean() {
    return Svg(120, 226, "Phone design with a centered logo, a photo, and a free estimate form",
      phoneShell() +
      R(8, 13, 104, 22, 4, C.bar) +
      Ln(14, 20, 24, 20, C.lineLt) + Ln(14, 24, 24, 24, C.lineLt) + Ln(14, 28, 24, 28, C.lineLt) +
      Ci(52, 24, 5, C.acc) + R(60, 22, 24, 4, 2, C.lineLt) + Ci(101, 24, 5.5, "none", C.acc) +
      R(8, 39, 104, 52, 4, C.photo) + Poly("28,78 60,54 92,78", "#4D5666") + R(44, 78, 32, 13, 0, "#4D5666") +
      R(24, 99, 72, 7, 2, C.white) + R(36, 110, 48, 7, 2, C.white) +
      R(30, 123, 60, 3, 1.5, C.lineLt) +
      R(32, 132, 56, 12, 6, C.acc) + R(46, 136, 28, 4, 2, C.ink) +
      R(8, 152, 104, 46, 5, C.bar) + R(16, 158, 88, 9, 3, C.field) + R(16, 170, 88, 9, 3, C.field) + R(16, 183, 88, 9, 3, C.accDk) +
      stars(44, 211, 5));
  }
  // Photo-forward: logo left, call button right (no menu), photo collage first, services grid below
  function phoneShowcase() {
    return Svg(120, 226, "Phone design with a photo collage and a services grid",
      phoneShell() +
      R(8, 13, 104, 22, 4, C.bar) + Ci(19, 24, 5, C.acc) + R(27, 22, 20, 4, 2, C.lineLt) +
      R(82, 17, 26, 14, 7, C.acc) + R(88, 22, 14, 4, 2, C.ink) +
      R(8, 39, 50, 40, 4, C.photo) + R(62, 39, 50, 40, 4, C.photoDk) + R(8, 83, 50, 40, 4, C.photoDk) + R(62, 83, 50, 40, 4, C.photo) +
      R(12, 43, 18, 5, 2.5, C.ink) + R(66, 43, 18, 5, 2.5, C.ink) +
      Ci(33, 64, 7, "#566073") + R(70, 62, 34, 10, 2, "#566073") + R(14, 100, 34, 12, 2, "#566073") + Ci(87, 104, 7, "#566073") +
      R(8, 130, 60, 6, 2, C.white) + R(8, 140, 40, 4, 2, C.lineLt) +
      R(8, 150, 50, 24, 4, C.bar) + Ci(18, 162, 5, C.accDk) + R(27, 159, 24, 3, 1.5, C.lineLt) + R(27, 165, 16, 3, 1.5, C.line) +
      R(62, 150, 50, 24, 4, C.bar) + Ci(72, 162, 5, C.accDk) + R(81, 159, 24, 3, 1.5, C.lineLt) + R(81, 165, 16, 3, 1.5, C.line) +
      R(8, 178, 50, 24, 4, C.bar) + Ci(18, 190, 5, C.accDk) + R(27, 187, 24, 3, 1.5, C.lineLt) + R(27, 193, 16, 3, 1.5, C.line) +
      R(62, 178, 50, 24, 4, C.bar) + Ci(72, 190, 5, C.accDk) + R(81, 187, 24, 3, 1.5, C.lineLt) + R(81, 193, 16, 3, 1.5, C.line) +
      R(8, 208, 104, 12, 5, C.acc) + R(36, 212, 48, 4, 2, C.ink));
  }

  /* ---------- pricing layouts ---------- */
  function priceTiers() {
    var out = "";
    [6, 54, 102].forEach(function (x, i) {
      var mid = i === 1;
      out += R(x, 10, 42, 78, 5, C.bar, mid ? C.acc : C.frame) +
        (mid ? R(x + 8, 5, 26, 8, 4, C.acc) + R(x + 13, 7.5, 16, 3, 1.5, C.ink) : "") +
        R(x + 8, 20, 26, 4, 2, C.white) + R(x + 8, 29, 18, 8, 2, C.acc) +
        R(x + 8, 43, 26, 3, 1.5, C.lineLt) + R(x + 8, 50, 22, 3, 1.5, C.lineLt) + R(x + 8, 57, 26, 3, 1.5, C.lineLt) +
        R(x + 8, 72, 26, 9, 3, mid ? C.acc : C.line);
    });
    return Svg(150, 96, "Three pricing cards side by side, the middle one highlighted", out);
  }
  function priceList() {
    var out = R(8, 8, 134, 80, 6, C.bar, C.frame);
    [[60, 22], [46, 38], [66, 54], [52, 70]].forEach(function (row) {
      out += R(18, row[1], row[0], 5, 2.5, C.lineLt) + R(112, row[1] - 1, 22, 7, 3, C.acc);
      if (row[1] < 70) out += Ln(18, row[1] + 11, 132, row[1] + 11, C.line, 1);
    });
    return Svg(150, 96, "A simple list of services with a price beside each one", out);
  }
  function priceStarting() {
    var out = "";
    [[8, 8], [78, 8], [8, 50], [78, 50]].forEach(function (p) {
      out += R(p[0], p[1], 64, 38, 5, C.bar, C.frame) + R(p[0] + 5, p[1] + 5, 54, 14, 3, C.photo) +
        R(p[0] + 5, p[1] + 24, 30, 3, 1.5, C.lineLt) + R(p[0] + 38, p[1] + 22, 21, 8, 4, C.acc);
    });
    return Svg(150, 96, "Four service tiles, each with a starting at price tag", out);
  }

  /* ---------- map layouts (same frame, same map drawing; only the arrangement changes) ---------- */
  function mapArt(x, y, w, h, cx, cy, r) {
    return R(x, y, w, h, 4, C.map) +
      Ln(x + 3, y + h * 0.7, x + w - 3, y + h * 0.32, "#3A4756", 3) + Ln(x + w * 0.3, y + 3, x + w * 0.62, y + h - 3, "#3A4756", 3) +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + C.acc + '" fill-opacity="0.28" stroke="' + C.acc + '" stroke-width="1.5"/>' +
      Ci(cx, cy, 3, C.acc);
  }
  function mapFrame() { return R(0.5, 0.5, 149, 95, 8, C.screen, C.frame); }
  // Full-width map: one big map across the page
  function mapFull() {
    return Svg(150, 96, "One wide map across the page with a line of text under it",
      mapFrame() + mapArt(8, 8, 134, 58, 75, 37, 22) + R(8, 73, 64, 4, 2, C.white) + R(8, 81, 104, 3, 1.5, C.lineLt));
  }
  // Map and city list: map on the left, the cities you serve on the right
  function mapSplit() {
    var out = mapFrame() + mapArt(8, 8, 74, 80, 45, 48, 24);
    [[18, 34], [32, 40], [46, 30], [60, 38], [74, 32]].forEach(function (row) {
      out += Ci(92, row[0] + 2, 2.5, C.acc) + R(99, row[0], row[1], 4, 2, C.lineLt);
    });
    return Svg(150, 96, "A map on the left and a list of cities on the right", out);
  }
  // Map and contact form: contact form on the left, map on the right
  function mapForm() {
    return Svg(150, 96, "A contact form on the left and a map on the right",
      mapFrame() + R(8, 12, 64, 5, 2, C.white) +
      R(8, 24, 64, 10, 3, C.field) + R(8, 38, 64, 10, 3, C.field) + R(8, 52, 64, 10, 3, C.field) + R(8, 68, 64, 12, 4, C.accDk) +
      mapArt(80, 8, 62, 80, 111, 48, 20));
  }

  OnboardingForm.init({
    businessName: "LetLois",
    partLabel: "Onboarding Form · Part 2",
    apiEndpoint: "/api/submit-website",
    fallbackEmail: "hello@letlois.com",

    steps: [
      { id: "welcome", type: "welcome",
        title: "Your Website.",
        subtitle: "A few details about your services, where you work, and how you'd like your website to look. About 5 minutes.",
        cta: "Start" },

      { id: "business_name", type: "text", required: true,
        question: "What's your business name?",
        placeholder: "Acme",
        context: "Use the same name you gave us in Part 1. It's how we match your answers together across every part of this form." },

      { id: "listed_services", type: "list", required: true, minItems: 3,
        question: "What services do you want on your website?",
        subtitle: "Start with your top three. You can add more below.",
        placeholders: ["First service", "Second service", "Third service"],
        placeholder: "Another service", itemLabel: "Service", addLabel: "Add another service",
        context: "These become the service sections and pages on your site, so list everything you want customers to see." },

      { id: "service_area", type: "radius-map", required: true,
        question: "Where do you work?",
        subtitle: "Enter the ZIP code you work out of, then drag the slider to how far you'll travel.",
        context: "We use this to build your location pages and to target your ads around your home base." },

      { id: "logo", type: "file", required: true, multiple: false, maxSizeMB: 25,
        accept: "image/*,.pdf,.ai,.eps,.svg",
        question: "Can you upload your logo?",
        subtitle: "PNG, JPG, SVG, or PDF all work.",
        dropText: "Drop your logo here, or click to browse",
        context: "We use it on your website and your ads. Your brand colors can come straight from it on the next question." },

      { id: "brand_colors", type: "colors", logoStepId: "logo",
        question: "What are your website brand colors?",
        subtitle: "Pick your main color first, then your secondary and accent.",
        slots: [
          { id: "main", label: "Main", required: true },
          { id: "secondary", label: "Secondary", required: true },
          { id: "accent", label: "Accent", required: false }
        ],
        context: "Drag the color scale, pick a quick color, type a color code, or tap a color in your logo. We save the exact color codes, so nothing gets lost in translation." },

      { id: "design_template", type: "cards", required: true, columns: 3, shape: "phone",
        question: "Which style is closest to what you want?",
        subtitle: "A rough idea is all we need. We'll refine it together.",
        options: [
          { id: "bold", title: "Bold and direct", desc: "Big headline, call button front and center.", preview: phoneBold() },
          { id: "clean", title: "Clean and trusted", desc: "Centered logo, free estimate form up top.", preview: phoneClean() },
          { id: "showcase", title: "Photo-forward", desc: "Your work first, services grid below.", preview: phoneShowcase() },
          { id: "other", other: true, title: "Something else", desc: "Tell us what you have in mind.",
            placeholder: "Describe the style you want, or paste a link to a site you like." }
        ],
        context: "Every design works great on phones, since that's where most of your customers will see it." },

      { id: "wants_pricing", type: "select", required: true,
        question: "Should we show pricing on your website?",
        options: ["Yes", "No"] },

      { id: "pricing_layout", type: "cards", required: true, columns: 3,
        showIf: { id: "wants_pricing", equals: "Yes" },
        skippable: true, skipLabel: "Skip this, I'll send pricing later",
        question: "How should your pricing look?",
        subtitle: "Pick the layout that fits best.",
        options: [
          { id: "tiers", title: "Three price tiers", desc: "Good, better, best side by side.", preview: priceTiers() },
          { id: "list", title: "Simple price list", desc: "Each service with its price.", preview: priceList() },
          { id: "starting", title: "Starting-at prices", desc: "A \"from $\" price on each service.", preview: priceStarting() },
          { id: "custom", other: true, title: "Custom", desc: "Describe your own setup.",
            placeholder: "Describe how you'd like your pricing shown." }
        ] },

      { id: "pricing_tiers", type: "rows", required: true,
        showIf: { id: "pricing_layout", path: "choice", equals: "tiers" },
        skippable: true, skipLabel: "Skip this, I'll send my prices later",
        question: "What are your three pricing tiers?",
        subtitle: "Name each tier, add a price, and say what's included.",
        prefillLabels: ["Basic", "Standard", "Premium"], minRows: 3, allowRemove: false,
        columns: [
          { key: "label", label: "Tier name", placeholder: "e.g. Basic", width: "1fr" },
          { key: "price", label: "Price", placeholder: "e.g. 199", prefix: "$", width: "0.8fr" },
          { key: "incl", label: "What's included", placeholder: "e.g. Inspection and minor repairs", width: "1.7fr" }
        ] },

      { id: "pricing_list", type: "rows", required: true,
        showIf: { id: "pricing_layout", path: "choice", equals: "list" },
        skippable: true, skipLabel: "Skip this, I'll send my prices later",
        question: "What does each service cost?",
        subtitle: "We've listed your services. Add a price for each one.",
        prefillFrom: "listed_services", minRows: 1, allowAdd: true, addLabel: "Add another service",
        columns: [
          { key: "label", label: "Service", placeholder: "Service", width: "1.6fr" },
          { key: "price", label: "Price", placeholder: "e.g. 150", prefix: "$", width: "1fr" }
        ] },

      { id: "pricing_starting", type: "rows", required: true,
        showIf: { id: "pricing_layout", path: "choice", equals: "starting" },
        skippable: true, skipLabel: "Skip this, I'll send my prices later",
        question: "What's the starting price for each service?",
        subtitle: "These show as \"starting at\" prices on each service.",
        prefillFrom: "listed_services", minRows: 1, allowAdd: true, addLabel: "Add another service",
        columns: [
          { key: "label", label: "Service", placeholder: "Service", width: "1.6fr" },
          { key: "price", label: "Starting at", placeholder: "e.g. 99", prefix: "$", width: "1fr" }
        ] },

      { id: "wants_service_area_map", type: "select", required: true,
        question: "Do you want a map of your service area on your website?",
        options: ["Yes", "No"] },

      { id: "site_map_layout", type: "cards", required: true, columns: 3,
        showIf: { id: "wants_service_area_map", equals: "Yes" },
        question: "How should the map look?",
        subtitle: "Pick the layout you like best.",
        options: [
          { id: "full", title: "Full-width map", desc: "One big map across the page.", preview: mapFull() },
          { id: "split", title: "Map and city list", desc: "A map next to the cities you serve.", preview: mapSplit() },
          { id: "form", title: "Map and contact form", desc: "A map beside your contact form.", preview: mapForm() },
          { id: "custom", other: true, title: "Custom", desc: "Describe what you want.",
            placeholder: "Describe how you'd like the map to look." }
        ] },

      { id: "end", type: "end",
        title: "Part 2 complete.",
        subtitle: "Thanks. We've got what we need for your website. Part 3 is next." }
    ]
  });
</script>
</body>
</html>
