<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ads Onboarding — Part 3: Assets</title>

<!--
  Ads plan, Part 3 of 3 — Assets for Landing Pages & Meta Ads.
  This page only defines CONFIG. All rendering/logic lives in
  /shared/onboarding-engine-v2.js so every part of every plan behaves the
  same way. Edit the "steps" array below to change questions.

  Every question here is required. The only optional thing is the fourth
  service on the services question.

  chunkedUpload sends the files ahead of the final submit, in 10 MB pieces,
  into the private R2 bucket, so very large videos work and nothing is
  compressed. maxTotalMB (20480 = 20 GB) is the most a client can upload in one
  go, across every upload question combined; maxSizeMB on a question is the
  limit for a single file (a single file can never be over 5 GB). Each upload
  question also has a "paste a link" box so a required upload is never a dead
  end.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/onboarding.css">
<link rel="stylesheet" href="../../shared/onboarding-extras.css">
</head>
<body>

<div class="shell">
  <img class="brand-mark" src="../../shared/assets/logo-icon.png" alt="LetLois">
  <div class="card" id="card"></div>
  <footer class="credit" id="footerCredit"></footer>
</div>
<span class="visually-hidden" aria-live="polite" id="liveRegion"></span>

<script src="../../shared/onboarding-engine-v2.js"></script>
<script>
  OnboardingForm.init({
    businessName: "LetLois",
    partLabel: "Onboarding Form · Part 3",
    apiEndpoint: "/api/submit-assets",
    fallbackEmail: "hello@letlois.com",
    chunkedUpload: true,
    maxTotalMB: 20480,

    steps: [
      { id: "welcome", type: "welcome",
        title: "Your Assets.",
        subtitle: "The details, photos, and videos we'll use to build your landing pages and ads. This is the part that makes your pages great, so the more you give us, the better they'll turn out. About 10 minutes.",
        cta: "Start" },

      { id: "business_name", type: "text", required: true, prefillParam: "business",
        question: "What's your business name?",
        placeholder: "Acme",
        context: "We'll use this to match your assets to the answers you already gave us in Parts 1 and 2." },

      { id: "top_3_services", type: "list", required: true, minItems: 3, maxItems: 4,
        question: "What are the top services?",
        subtitle: "The services you most want new customers for. Add at least three. A fourth is optional.",
        copyFrom: { url: "/api/lookup-services", label: "Use the same services from my website form", businessFrom: "business_name" },
        placeholders: ["First service", "Second service", "Third service"],
        placeholder: "Fourth service (optional)",
        itemLabel: "Service", addLabel: "Add a fourth service (optional)",
        context: "Each of these gets its own landing page on your website, so they become the pages that bring in your best leads. We start with three. If you'd like a fourth, add it and we'll ask why it matters." },

      { id: "offer_details", type: "item-details", required: true, itemsFrom: "top_3_services",
        question: "Tell us about each offer.",
        subtitle: "Short answers are fine. Every box is required.",
        context: "Each service gets its own landing page, so we need to know what you're offering and what you want from it, plus any discount you want to run.",
        fields: [
          { key: "offer", minChars: 30, help: "A few sentences is perfect.",
            label: "What's your {item} offer, and what's your goal?",
            placeholder: "Example: Full roof replacements for homeowners. Goal: more large jobs." },
          { key: "promo", minChars: 3, help: "Write \"none yet\" if there isn't one.",
            label: "Any discount or promo for {item}?",
            placeholder: "Example: 10% off, free inspection, or financing." }
        ],
        extraFromIndex: 3,
        extraFields: [
          { key: "why", minChars: 15,
            label: "Why do you want a page for {item}?",
            placeholder: "Why this service matters to your business." }
        ] },

      { id: "before_after_photos", type: "file", required: true, multiple: true, maxSizeMB: 100, allowLink: true,
        accept: "image/*,.heic,.heif",
        question: "Upload before and after photos of your work.",
        subtitle: "Show us the jobs you're proudest of. We'll feature your best work on {{top_3_services|your services}} on your website.",
        dropText: "Drop your photos here, or click to browse",
        linkLabel: "Lots of photos? Paste a link to a folder instead (Google Drive, Dropbox, or WeTransfer).",
        context: "Real photos of your own work build trust faster than anything else on a landing page. Send a mix of before and after shots, finished jobs, and work in progress. Phone photos are perfect." },

      { id: "team_photos", type: "file", required: true, multiple: true, maxSizeMB: 100, allowLink: true,
        accept: "image/*,.heic,.heif",
        question: "Upload photos of your team and yourself.",
        subtitle: "Headshots, a crew photo, your trucks, or your shop. No team? Just send photos of yourself.",
        dropText: "Drop your photos here, or click to browse",
        linkLabel: "Lots of photos? Paste a link to a folder instead (Google Drive, Dropbox, or WeTransfer).",
        context: "People hire people they can picture at their door. Real photos of you and your crew (or just you) make your website feel local and trustworthy, and they go on your About and contact sections." },

      { id: "videos", type: "file", required: true, multiple: true, maxSizeMB: 5120, allowLink: true,
        accept: "video/*,.mp4,.mov,.m4v,.webm,.avi",
        question: "Upload any and all videos you have.",
        subtitle: "Jobs in progress, finished projects, walk-throughs of your work, your office or shop, your crew and trucks, or customer testimonials. Phone videos are perfect.",
        dropText: "Drop your videos here, or click to browse",
        linkLabel: "Having trouble uploading? Paste a link to your videos instead (Google Drive, Dropbox, or WeTransfer).",
        context: "Video turns visitors into customers. We use your clips on your landing pages and in your ads, and raw phone footage works great. We keep your videos in their original quality, so upload them as they are, with no need to shrink or compress them. If uploading doesn't work for you, paste a link to them below." },

      { id: "end", type: "end",
        title: "Part 3 complete.",
        subtitle: "That's everything — thanks for finishing your onboarding. We'll be in touch soon." }
    ]
  });
</script>
</body>
</html>
